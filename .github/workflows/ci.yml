# Spec §49: checks for pull requests and main. Cloud smoke tests stay manual (protected DEV secrets).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_sdk
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  notification-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notification_admin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # Integration tests skip without NTF_IT_URL (they need a local engine).
      - run: flutter test

  flutter-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_demo
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      # Build against the SDK in this commit instead of the Git dependency (no deploy key needed).
      - run: |
          cat > pubspec_overrides.yaml <<'YAML'
          dependency_overrides:
            notification_sdk:
              path: ../flutter_sdk
          YAML
      - run: flutter pub get
      - run: flutter build web --release

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: node --test tests/parser.test.mjs
      - run: deno check supabase/functions/notification/index.ts typescript_sdk/client.ts
      - run: deno test -A tests/logic.test.ts tests/config.test.ts

  migrations:
    # Applies every migration plus the local seed to a disposable Supabase Postgres image (with pgmq, pg_cron, pg_net, vault).
    runs-on: ubuntu-latest
    services:
      db:
        image: supabase/postgres:15.8.1.085
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in supabase/migrations/*.sql; do
            echo "== $f"; psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
          # Re-running the new migrations must be a no-op (safe re-apply on shared DEV).
          for f in supabase/migrations/20261126*.sql; do psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"; done
